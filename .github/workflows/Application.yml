name: Application Deploy

on:
  push:
    branches:
    - main
    - Testing
jobs:
  UIDeploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install Node Modules
      working-directory: ./Ui
      run: npm install

    - name: Build Project
      working-directory: ./Ui
      run: npm run build

    - name: UI Deploy
      run: echo "Deploy UI Done"

  ServerDeploy:
    needs: UIDeploy
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install Node Modules
      working-directory: ./Server
      run: npm install

    - name: Server Deploy
      run: echo "Deploy Server Done"

Build:
  name: Build & Push Docker Image
  runs-on: ubuntu-latest

  steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build Images
      run: docker compose build

    - name: Push Backend
      run: docker push tharun/project-management-server:1.0.0

    - name: Push Frontend
      run: docker push tharun/project-management-frontend:1.0.0